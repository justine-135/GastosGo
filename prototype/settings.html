<!DOCTYPE html>
<!-- PROTOTYPE — throwaway. Settings screen with live toggles and sheets. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GastosGo · Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#F4A261;--secondary:#A8DADC;--accent:#E9C46A;
  --bg:#FFF8F0;--card:#FFECD2;--fg:#2D3047;
  --destructive:#E76F51;--muted:#81B29A;
  --border:#e5ddd4;--muted-text:#6b7280;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#ede8e3;display:flex;min-height:100vh;padding:20px;gap:20px;align-items:flex-start;line-height:1.5;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}

/* PHONE */
.phone-wrap{width:375px;flex-shrink:0;position:sticky;top:20px}
.phone-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;text-align:center;margin-bottom:6px}
.phone{width:375px;height:812px;background:var(--bg);border-radius:46px;box-shadow:0 24px 64px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.6);overflow:hidden;position:relative;border:11px solid #1a1a2e;display:flex;flex-direction:column;transition:background .25s}
.phone.dark{--bg:#1A1A2E;--card:#16213E;--fg:#E8E8E8;--border:#2D3A5A;--muted-text:#9CA3AF;background:#1A1A2E}
.phone.dark .toggle.off{background:#374151}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#1a1a2e;border-radius:0 0 18px 18px;z-index:100}
.sbar{display:flex;justify-content:space-between;padding:10px 22px 2px;font-size:12px;font-weight:600;color:var(--fg);flex-shrink:0}
.hdr{padding:6px 20px 4px;display:flex;align-items:center;flex-shrink:0}
.hdr-title{font-size:20px;font-weight:700;color:var(--fg);letter-spacing:-0.02em;line-height:1.2}
.scrollable{flex:1;overflow-y:auto;padding-bottom:88px}

/* TAB BAR */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:80px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding-bottom:14px;z-index:10;transition:background .25s}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;opacity:.45;border:none;background:none;padding:4px 10px}
.tab-btn.active{opacity:1}
.tab-btn span:first-child{font-size:21px}
.tab-btn span:last-child{font-size:10px;font-weight:600;color:var(--fg);letter-spacing:0.025em}
.tab-btn.active span:last-child{color:var(--primary)}

/* SETTINGS ROWS */
.section-hdr{padding:16px 20px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;line-height:1.4;color:var(--muted-text)}
.settings-card{background:var(--card);border-radius:16px;margin:0 16px 8px;padding:0 16px;overflow:hidden;transition:background .25s}
.row{display:flex;align-items:center;min-height:44px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .08s}
.row:not(.static):active{background:rgba(0,0,0,.05)}
.phone.dark .row:not(.static):active{background:rgba(255,255,255,.07)}
.row:last-child{border-bottom:none}
.row.static{cursor:default}
.row-left{flex:1}
.row-label{font-size:15px;color:var(--fg);line-height:1.35}
.row-sublabel{font-size:13px;color:var(--muted-text);margin-top:2px;line-height:1.35}
.row-right{display:flex;align-items:center;gap:5px}
.row-value{font-size:15px;color:var(--muted-text);line-height:1.35}
.row-chevron{font-size:15px;color:var(--muted-text);line-height:1;opacity:.5}

/* TOGGLE */
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.off{background:#D1D5DB}
.toggle.on{background:var(--primary)}
.toggle-thumb{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.toggle.off .toggle-thumb{left:3px}
.toggle.on .toggle-thumb{left:21px}

/* THEME CHIPS */
.chip-row{display:flex;align-items:center;padding:12px 0}
.chip-label{font-size:15px;color:var(--fg);flex:1}
.chips{display:flex;gap:6px}
.chip{padding:5px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--muted-text);background:var(--bg);transition:all .15s;-webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* SYNC ROW */
.sync-btn{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .1s}
.sync-btn:active{opacity:.75}

/* BOTTOM SHEET */
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;overflow-y:auto;padding-bottom:28px;transition:background .25s}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px}
.sheet-hdr{padding:8px 20px 12px;display:flex;align-items:center;border-bottom:1px solid var(--border)}
.sheet-title{font-size:16px;font-weight:700;color:var(--fg);letter-spacing:-0.01em;line-height:1.2}
.sheet-close{margin-left:auto;background:var(--card);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--muted-text)}
.sheet-body{padding:12px 20px 0}

/* RECENTLY DELETED */
.del-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);transition:opacity .25s}
.del-row:last-child{border-bottom:none}
.del-info{flex:1}
.del-name{font-size:14px;font-weight:600;color:var(--fg)}
.del-meta{font-size:13px;color:var(--muted-text);margin-top:1px;line-height:1.35}
.del-amt{font-size:14px;font-weight:700;color:var(--fg);margin-right:10px}
.restore-btn{background:var(--muted);color:#fff;border:none;border-radius:12px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer}
.del-note{font-size:12px;color:var(--muted-text);text-align:center;padding-top:14px;line-height:1.4}
.del-empty{text-align:center;padding:20px 0;font-size:13px;color:var(--muted-text)}

/* TIMEOUT OPTIONS */
.timeout-opt{display:flex;align-items:center;min-height:44px;padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.timeout-opt:last-child{border-bottom:none}
.timeout-opt:hover{background:var(--card)}
.timeout-opt:active{background:var(--border)}
.timeout-opt-label{flex:1;font-size:15px;color:var(--fg);line-height:1.35}
.timeout-check{font-size:16px;color:var(--primary)}

/* TOAST */
.toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:#2D3047dd;color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:20px;white-space:nowrap;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* RIGHT PANEL */
.right-panel{flex:1;display:flex;flex-direction:column;gap:14px;max-width:380px}
.rp-title{font-size:17px;font-weight:800;color:#1a1a2e}
.panel{background:#fff;border-radius:12px;padding:14px}
.panel h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:10px}
.sc-grid{display:flex;flex-wrap:wrap;gap:7px}
.sc-btn{padding:7px 12px;border:1.5px solid #e5ddd4;border-radius:18px;background:#fff;font-size:12px;cursor:pointer;color:#2D3047;font-weight:500;transition:all .15s}
.sc-btn:hover{border-color:var(--primary);color:var(--primary)}
.state-panel{background:#1a1a2e;border-radius:12px;padding:14px}
.state-panel h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#4a5568;margin-bottom:10px}
pre.state-out{font-family:'Cascadia Code','Fira Code',monospace;font-size:11px;color:#a8dadc;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>

<div class="phone-wrap">
<div class="phone-label">Settings</div>
<div class="phone" id="phone">
<div class="notch"></div>
<div class="sbar"><span>9:41</span><span>⚡ 100%</span></div>
<div class="hdr"><span class="hdr-title">Settings</span></div>
<div class="scrollable" id="scroll"></div>

<div class="tab-bar">
  <button class="tab-btn"><span>🏠</span><span>Dashboard</span></button>
  <button class="tab-btn"><span>📊</span><span>Insights</span></button>
  <button class="tab-btn active"><span>⚙️</span><span>Settings</span></button>
</div>

<!-- Recently Deleted sheet -->
<div class="sheet-overlay" id="del-sheet" onclick="closeSheet('del-sheet',event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title">Recently Deleted</span>
      <button class="sheet-close" onclick="closeSheet('del-sheet')">✕</button>
    </div>
    <div class="sheet-body" id="del-body"></div>
  </div>
</div>

<!-- Lock Timeout sheet -->
<div class="sheet-overlay" id="timeout-sheet" onclick="closeSheet('timeout-sheet',event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title">Lock Timeout</span>
      <button class="sheet-close" onclick="closeSheet('timeout-sheet')">✕</button>
    </div>
    <div id="timeout-opts"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div><!-- /phone -->
</div><!-- /phone-wrap -->

<!-- RIGHT PANEL -->
<div class="right-panel">
  <div class="rp-title">Settings Prototype</div>
  <div class="panel">
    <h3>Scenarios</h3>
    <div class="sc-grid">
      <button class="sc-btn" onclick="scenario('default')">Default</button>
      <button class="sc-btn" onclick="scenario('dark')">Dark mode</button>
      <button class="sc-btn" onclick="scenario('locked')">Lock enabled</button>
      <button class="sc-btn" onclick="scenario('no-notifs')">Notifs off</button>
      <button class="sc-btn" onclick="scenario('synced')">Just synced</button>
      <button class="sc-btn" onclick="scenario('no-deleted')">Empty deleted</button>
    </div>
  </div>
  <div class="state-panel">
    <h3>Live State</h3>
    <pre class="state-out" id="state-out"></pre>
  </div>
</div>

<script>
const TIMEOUTS = [30, 60, 300, 0]
const TL = { 0:'Never', 30:'30 seconds', 60:'1 minute', 300:'5 minutes' }

const S = {
  theme: 'system',
  notifyBudgetAlerts: true,
  notifyBillReminders: true,
  appLockEnabled: false,
  lockTimeout: 60,
  lastSyncedAt: null,
}

let deletedItems = [
  { name:'Jollibee', cat:'Food 🍚', amt:189, date:'Nov 14' },
  { name:'Grab (Pasig → BGC)', cat:'Transport 🚌', amt:95, date:'Nov 13' },
  { name:'Netflix', cat:'Subscriptions 📱', amt:549, date:'Nov 10' },
]

function fmt(n){ return '₱' + n.toLocaleString('en-PH') }

function timeAgo(iso){
  if(!iso) return 'Never'
  const m = Math.floor((Date.now() - new Date(iso)) / 60000)
  if(m<1) return 'Just now'
  if(m<60) return `${m} min${m!==1?'s':''} ago`
  return `${Math.floor(m/60)} hr ago`
}

function render(){
  document.getElementById('phone').classList.toggle('dark', S.theme==='dark')

  const lock = S.appLockEnabled
  document.getElementById('scroll').innerHTML = `
    <div class="section-hdr">Profile</div>
    <div class="settings-card">
      ${nav('Income Mode','Salary',"toast('Profile editing coming soon')")}
      ${nav('Budget Cycle Start','1st of month',"toast('Profile editing coming soon')")}
      ${nav('Currency','PHP',"toast('Profile editing coming soon')")}
    </div>

    <div class="section-hdr">Notifications</div>
    <div class="settings-card">
      ${tog('Budget Alerts','Notify at 80% and 100% of category budgets','notifyBudgetAlerts')}
      ${tog('Bill Reminders','1 day before recurring bills are due','notifyBillReminders')}
    </div>

    <div class="section-hdr">Security</div>
    <div class="settings-card">
      ${tog('App Lock', lock ? 'PIN required on open' : 'Tap to set up PIN lock','appLockEnabled')}
      ${lock ? nav('Lock Timeout', TL[S.lockTimeout], 'openTimeoutSheet()') : ''}
      ${lock ? nav('Change PIN','', "toast('PIN setup coming in next prototype')") : ''}
    </div>

    <div class="section-hdr">Appearance</div>
    <div class="settings-card">
      <div class="chip-row">
        <span class="chip-label">Theme</span>
        <div class="chips">
          ${['system','light','dark'].map(t=>`<div class="chip${S.theme===t?' active':''}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="section-hdr">Data</div>
    <div class="settings-card">
      <div class="row static">
        <div class="row-left">
          <div class="row-label">Last Synced</div>
          <div class="row-sublabel">${timeAgo(S.lastSyncedAt)}</div>
        </div>
        <button class="sync-btn" onclick="syncNow()">Sync Now</button>
      </div>
      ${nav('Recently Deleted', deletedItems.length ? `${deletedItems.length} items` : 'Empty', 'openDeletedSheet()')}
    </div>

    <div class="section-hdr">About</div>
    <div class="settings-card">
      ${dis('Version','1.0.0')}
      ${nav('Privacy Policy','', "toast('Opens in browser')")}
    </div>

    <div style="height:16px"></div>
  `

  document.getElementById('state-out').textContent = JSON.stringify(
    { ...S, recentlyDeletedCount: deletedItems.length }, null, 2
  )
}

function nav(label, value, onclick){
  return `<div class="row" onclick="${onclick}">
    <div class="row-left">
      <div class="row-label">${label}</div>
      ${value ? `<div class="row-sublabel">${value}</div>` : ''}
    </div>
    <span class="row-chevron">›</span>
  </div>`
}

function tog(label, sublabel, key){
  const on = S[key]
  return `<div class="row static">
    <div class="row-left">
      <div class="row-label">${label}</div>
      <div class="row-sublabel">${sublabel}</div>
    </div>
    <div class="toggle ${on?'on':'off'}" onclick="flip('${key}')">
      <div class="toggle-thumb"></div>
    </div>
  </div>`
}

function dis(label, value){
  return `<div class="row static">
    <span class="row-label">${label}</span>
    <span class="row-value">${value}</span>
  </div>`
}

function flip(key){
  if(key==='appLockEnabled' && !S[key]) toast('PIN setup required — toggle on to simulate')
  S[key] = !S[key]
  render()
}

function setTheme(t){ S.theme = t; render() }

function syncNow(){
  S.lastSyncedAt = new Date().toISOString()
  toast('Sync complete ✓')
  render()
}

function openDeletedSheet(){
  document.getElementById('del-body').innerHTML = deletedItems.length
    ? deletedItems.map((item,i) => `
        <div class="del-row" id="di-${i}">
          <div class="del-info">
            <div class="del-name">${item.name}</div>
            <div class="del-meta">${item.cat} · ${item.date}</div>
          </div>
          <span class="del-amt">${fmt(item.amt)}</span>
          <button class="restore-btn" onclick="restoreItem(${i})">Restore</button>
        </div>
      `).join('') + `<div class="del-note">Permanently deleted after 30 days</div>`
    : `<div class="del-empty">No recently deleted expenses</div>`
  document.getElementById('del-sheet').classList.add('open')
}

function restoreItem(i){
  const el = document.getElementById(`di-${i}`)
  if(el) el.style.opacity = '0.3'
  setTimeout(() => {
    deletedItems.splice(i, 1)
    toast('Expense restored')
    openDeletedSheet()
    render()
  }, 300)
}

function openTimeoutSheet(){
  document.getElementById('timeout-opts').innerHTML = TIMEOUTS.map(t => `
    <div class="timeout-opt" onclick="selectTimeout(${t})">
      <span class="timeout-opt-label">${TL[t]}</span>
      ${S.lockTimeout===t ? '<span class="timeout-check">✓</span>' : ''}
    </div>
  `).join('')
  document.getElementById('timeout-sheet').classList.add('open')
}

function selectTimeout(t){
  S.lockTimeout = t
  closeSheet('timeout-sheet')
  render()
}

function closeSheet(id, e){
  if(e && e.target !== document.getElementById(id)) return
  document.getElementById(id).classList.remove('open')
}

let _tt
function toast(msg){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(_tt)
  _tt = setTimeout(() => el.classList.remove('show'), 2200)
}

const SCENARIOS = {
  default:    { theme:'system', notifyBudgetAlerts:true,  notifyBillReminders:true,  appLockEnabled:false, lockTimeout:60,  lastSyncedAt:null },
  dark:       { theme:'dark',   notifyBudgetAlerts:true,  notifyBillReminders:true,  appLockEnabled:false, lockTimeout:60,  lastSyncedAt:null },
  locked:     { theme:'system', notifyBudgetAlerts:true,  notifyBillReminders:true,  appLockEnabled:true,  lockTimeout:60,  lastSyncedAt:null },
  'no-notifs':{ theme:'system', notifyBudgetAlerts:false, notifyBillReminders:false, appLockEnabled:false, lockTimeout:60,  lastSyncedAt:null },
  synced:     { theme:'system', notifyBudgetAlerts:true,  notifyBillReminders:true,  appLockEnabled:false, lockTimeout:60,  lastSyncedAt:new Date().toISOString() },
  'no-deleted':null,
}

function scenario(id){
  if(id==='no-deleted'){ deletedItems=[]; render(); return }
  Object.assign(S, SCENARIOS[id])
  render()
}

render()
</script>
</body>
</html>
