appId: com.gastosgo.app
---
# Onboarding flow: Welcome → Income → Budget → PIN → Dashboard
# Navigate to onboarding screen via deep link (app has no auto-redirect for new users)
# stopApp: true (default) kills the process and cold-restarts — fresh nav stack,
# but no clearState so DB/preferences are kept. Bundle is cached so load is fast.
- launchApp:
    stopApp: true
    clearState: true
# Wait for the app to fully initialize (dashboard is the default route after clearState)
- extendedWaitUntil:
    visible: "Recent Transactions"
    timeout: 30000
- openLink: "com.gastosgo.app://onboarding"

# Step 1: Welcome
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- takeScreenshot: onboarding-01-welcome
- tapOn: "Get Started"

# Step 2: Income — tap salary field first so inputText has a focused target
- extendedWaitUntil:
    visible: "How do you earn?"
    timeout: 15000
- tapOn: "Fixed Salary"
- tapOn:
    id: "income-salary-input"
- inputText: "30000"
- hideKeyboard
# hideKeyboard sends KEYCODE_BACK; if no keyboard was open it triggers the
# onboarding BackHandler → Exit dialog. Dismiss it optionally so Continue works.
- tapOn:
    text: "STAY"
    optional: true
- takeScreenshot: onboarding-02-income
- tapOn: "Continue →"

# Step 3: Budget — dismiss inherited salary keyboard, then tap Done by coordinates
# Button center is 50%,92% (540,2217 on 1080x2400). tapOn by label/id fails because
# React Native New Arch exposes the Button with empty content-desc and resource-id.
- extendedWaitUntil:
    visible: "Set Your Budgets"
    timeout: 20000
- takeScreenshot: onboarding-03-budget
- hideKeyboard
- tapOn:
    text: "STAY"
    optional: true
- takeScreenshot: budget-before-done
- tapOn:
    point: "50%, 87%"
- takeScreenshot: budget-after-done

# Step 4: PIN setup — 6-digit PIN, enter twice (create then confirm)
- extendedWaitUntil:
    visible: "Create a PIN"
    timeout: 15000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"
- takeScreenshot: onboarding-04-pin

# Step 5: Notifications / Biometrics — skip both
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Skip"
    optional: true

# Dashboard loaded
- extendedWaitUntil:
    visible: "Recent Transactions"
    timeout: 20000
- takeScreenshot: onboarding-05-dashboard
