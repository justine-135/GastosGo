appId: com.gastosgo.app
---
# Tab navigation: all 4 tabs load without crash
- launchApp:
    stopApp: false
- tapOn:
    text: "Cancel"
    optional: true
- assertVisible: "Recent Transactions"
- takeScreenshot: nav-dashboard
# dismiss Metro dev-tools warning banner before tapping the tab bar
- tapOn:
    text: "DISMISS"
    optional: true
- tapOn:
    text: "DISMISS ALL"
    optional: true
- tapOn:
    point: "50%, 3%"
    optional: true

- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "🔁 Recurring"
    timeout: 15000
- assertNotVisible: "Recent Transactions"
- takeScreenshot: nav-expenses

- tapOn: "Budgets"
- extendedWaitUntil:
    visible: "Budgets"
    timeout: 15000
- assertNotVisible: "Recent Transactions"
- takeScreenshot: nav-budgets

- tapOn: "Insights"
- extendedWaitUntil:
    visible: "Spending by Category"
    timeout: 15000
- assertNotVisible: "Recent Transactions"
- takeScreenshot: nav-insights

- tapOn: "Home"
- extendedWaitUntil:
    visible: "Recent Transactions"
    timeout: 15000
- takeScreenshot: nav-back-home
