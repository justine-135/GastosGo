      <text x="40" y="390" font-family="sans-serif" font-size="16">📅</text>
      <text x="66" y="390" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#111827">2026-11-18</text>

      <!-- ── Notes ── -->
      <text x="20" y="438" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="0.4">NOTES (OPTIONAL)</text>
      <rect x="20" y="448" width="350" height="48" rx="10" fill="#F3F4F6"/>
      <text x="36" y="478" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#111827">Jollibee</text>

